# dsh-sketch-draft — profile bundle patch.
#
# 由 package.json 的 `dsh.bundle.patch` 指向，安装时并入当前 profile 的 bundle 层：
#
#   dsh plugin --profile web add dsh-sketch-draft
#   dsh plugin --profile web add github:LLYlab/DSHSketchDraft
#
# loader entry 的 `name` 必须等于 npm 包名，否则 DSH 解析不到入口。
#
# 这里**故意不写 config**：Config 里每一项都有中性默认值，从一个干净的 profile
# 装上去就能直接启动，不会带入任何个人/机器路径。要改就覆盖自己的 patch 层：
#
#   - id: dsh-sketch-draft
#     config:
#       enabled: true
#       deferToDet: auto
#       dirName: .dsh-drafts
#       canvasWidth: 960
#       canvasHeight: 600
#       maxBytes: 8388608
#
# deferToDet 三档：
#   auto   —— DET 在场且它的「草图导入」开着时，本包让位（默认；输入框旁只留一个按钮）
#   never  —— 永不让位（已经把 DET 的 dltDraft 关掉、就用本包时更明确）
#   always —— 只要 DET 在场就让位（哪怕 DET 关了自己的草图）
- insert:
    - id: dsh-sketch-draft
      name: 'dsh-sketch-draft'
